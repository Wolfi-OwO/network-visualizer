name: PR · preview teardown

# Tears down a PR's VPS preview container and registry entry once the PR closes.
#
# WHY THIS IS A SEPARATE WORKFLOW, AND WHY pull_request_target
# This job used to live in pr-preview.yml under `pull_request: types: [closed]`.
# It silently never ran for the PRs that needed it most.
#
# For a `pull_request` event, GitHub runs the workflow from `refs/pull/<n>/merge`
# — the PR's head test-merged into the base. When a PR has a merge CONFLICT that
# ref cannot be built, so GitHub schedules no run at all. Not a failed run: no run.
# Close a conflicting PR and the teardown simply never happens, which is exactly
# how PR #10 and #13 left preview revisions running back when this pointed at
# the Azure Container App.
#
# `pull_request_target` runs from the BASE branch instead and never needs the merge
# ref, so it fires on close whether the PR was merged, abandoned, or conflicted.
#
# That trigger is normally dangerous, because it hands secrets to a workflow running
# on a PR-influenced event. It is safe here for one reason, which must stay true:
# THIS WORKFLOW NEVER CHECKS OUT OR EXECUTES PR CODE. It only reads the PR number
# from the event payload and issues one SSH command to the VPS's forced-command
# script. Do not add actions/checkout of the PR head here, and do not run anything
# from the PR's tree.
#
# Belt and braces beyond this workflow: even if a preview is ever missed here
# (crashed runner, a future gap in this condition), /opt/previews' own
# `previews-reaper.timer` polls every 15 minutes and tears down any preview
# whose PR is no longer open (or is older than 7 days regardless) — so a gap
# here is a 15-minute delay, not a permanent leak.

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: write # sticky preview comment

concurrency:
  group: pr-preview-teardown-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Tear down preview
    # These conditions must stay identical to the `prep` job in pr-preview.yml.
    # Teardown is only meaningful for branches that actually built a preview: on
    # release and dependabot PRs there is nothing to tear down.
    #
    # WHY THE DEPENDABOT CHECK READS THE PR AUTHOR AND NOT github.actor
    # This workflow's event is `closed`, and its actor is whoever CLOSED the PR —
    # you, merging it — not the PR's author. `github.event.pull_request.user.login`
    # is the PR's author on both this event and pr-preview.yml's, so it is the
    # form that can safely be kept identical between the two files.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.PREVIEW_ENABLED == 'true' &&
      !startsWith(github.head_ref, 'chore/release-')
    runs-on: ubuntu-latest
    steps:
      - name: Check config
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          miss=0
          for v in PREVIEW_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do
            [ -z "${!v}" ] && { echo "::error::missing: $v"; miss=1; }
          done
          [ "$miss" = 0 ] || { echo "Missing config for teardown."; exit 1; }

      - name: Set up SSH
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Destroy the preview on the VPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/preview_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "destroy netviz ${PR}"

      - name: Comment the teardown on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const merged = context.payload.pull_request.merged;
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              '## Preview torn down',
              '',
              merged
                ? 'This PR was merged — its preview container has been removed.'
                : 'This PR was closed — its preview container has been removed.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
