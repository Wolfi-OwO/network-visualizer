name: PR · preview

# Per-PR preview on the shared VPS preview infrastructure (167.86.115.79,
# /opt/previews/ — see docs/PREVIEWS.md in portfolio-webpage), replacing the
# old Azure Container Apps revision-copy approach. netviz itself moved off
# Container Apps to /opt/netviz on that same VPS (deploy.yml); this workflow
# is the PR-preview half of that same move.
#
# How a preview stays harmless:
#
#   * Isolation — the preview runs as its own container (`preview-netviz-pr<n>`),
#     never touching the production container or its .env. It reaches its own
#     small, non-production Mongo instance (`previews-mongo`, no relation to
#     any production database) with a fresh JWT secret generated for previews
#     only — see apps/netviz.env on the VPS, never committed here.
#
#   * One preview per PR — /opt/previews/create.sh removes any existing
#     container for this (app, PR) before starting the new one, so a second
#     push to the same PR REPLACES the running preview rather than adding a
#     second one. That guarantee lives in create.sh itself, not in this
#     workflow, so a cancelled/retried CI run can't leave two containers
#     answering the same alias.
#
#   * Sign-in — same as before the move: the preview URL is not a registered
#     OAuth redirect URI, so ALLOW_DEV_LOGIN is on for previews (baked into
#     apps/netviz.env on the box, not passed from here).
#
# Inert until you set the repo variable PREVIEW_ENABLED=true, and never runs
# for fork PRs (their token can't read secrets).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # sticky preview comment

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # ── Compute a stable, DNS-safe tag/suffix for this commit ──────────────────
  prep:
    name: Prepare
    # The release's own version-bump PR gets no preview — see the long-form
    # reasoning in pr-preview-teardown.yml, which must stay identical to this.
    # In short: release.yml opens and merges chore/release-vX.Y.Z within
    # seconds, long before this build finishes, so there is no open PR left
    # for a preview to attach to, and nothing in the bump commit itself is
    # worth previewing. Dependabot PRs get no secrets at all (GitHub
    # withholds them from dependency PRs), so the SSH deploy step would fail
    # every time regardless.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.PREVIEW_ENABLED == 'true' &&
      !startsWith(github.head_ref, 'chore/release-')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.o.outputs.tag }}
      sha: ${{ steps.o.outputs.sha }}
    steps:
      - id: o
        run: |
          SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${{ github.event.number }}-$SHA" >> "$GITHUB_OUTPUT"

  # ── Build the PR image (unique tag per commit; never moves :latest) ────────
  package:
    name: Build preview image
    needs: prep
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.prep.outputs.tag }}
      push_latest: false
    secrets: inherit

  # ── Tell the VPS to (re)create this PR's preview container ─────────────────
  preview:
    name: Deploy preview container
    needs: [prep, package]
    runs-on: ubuntu-latest
    steps:
      - name: Check config
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          miss=0
          for v in PREVIEW_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do
            [ -z "${!v}" ] && { echo "::error::missing: $v"; miss=1; }
          done
          [ "$miss" = 0 ] || { echo "PREVIEW_SSH_KEY/DEPLOY_KNOWN_HOSTS must be SECRETS; DEPLOY_HOST/DEPLOY_USER must be VARIABLES (already set for deploy.yml, reused here — same VPS, same host key)."; exit 1; }

      # Same DEPLOY_KNOWN_HOSTS secret deploy.yml already uses — one host key,
      # pinned once, reused by every workflow that talks to this VPS. A fresh
      # keyscan run by the CI job itself would trust whatever answered on
      # first connect, which is exactly the MITM a host-key check exists to
      # catch.
      - name: Set up SSH
        env:
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_SSH_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # This key's authorized_keys entry carries `command="/opt/previews/run.sh",restrict`
      # — the box, not this workflow, enforces that only `create`/`destroy` on the
      # onboarded app whitelist can ever run, regardless of what argv reaches it.
      # See docs/PREVIEWS.md in portfolio-webpage for the full validation chain.
      - name: Create/replace the preview on the VPS
        id: deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          PR: ${{ github.event.number }}
          SHA: ${{ needs.prep.outputs.sha }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          set -euo pipefail
          OUT=$(ssh -i ~/.ssh/preview_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "create netviz ${PR} ${SHA} ${TAG}")
          echo "$OUT"
          # create.sh prints the STABLE url first, the pinned (commit-specific) url second.
          STABLE_URL=$(echo "$OUT" | grep -m1 '^https://')
          PINNED_URL=$(echo "$OUT" | grep '^https://' | tail -n1)
          echo "stable_url=$STABLE_URL" >> "$GITHUB_OUTPUT"
          echo "pinned_url=$PINNED_URL" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL on the PR
        uses: actions/github-script@v9
        env:
          STABLE_URL: ${{ steps.deploy.outputs.stable_url }}
          PINNED_URL: ${{ steps.deploy.outputs.pinned_url }}
          BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
        with:
          script: |
            const stableUrl = process.env.STABLE_URL;
            const pinnedUrl = process.env.PINNED_URL;
            const password = process.env.BASIC_AUTH_PASSWORD;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const authedStable = stableUrl.replace('https://', `https://preview:${password}@`);
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              '## Preview deployment',
              '',
              `**${authedStable}**`,
              '',
              'A throwaway container on its own non-production database — it cannot see or',
              'change production data. Replaced automatically on every new push to this PR.',
              '',
              'Basic-auth is baked into the link above (shared, low-value password, keeps',
              'bots/search off preview URLs — not a production secret).',
              '',
              `<sub>pinned to this commit: ${pinnedUrl} · commit ${sha} · torn down when this PR closes</sub>`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
